<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </nav>
    </header>

    <h1>Create Your Account</h1>
    <form action="login.html">
        <h3>Register</h3>
        <div>
            <label for="name">Name : </label>
            <input type="text" name="name" id="" required placeholder="Enter Your Name"> <br>
            <label for="email">Email : </label>
            <input type="email" name="email" id="" required placeholder="Enter Your Email"><br>
            <label for="password">Password : </label>
            <input type="password" name="password" id="" required placeholder="Enter Your Password"><br>
            <label for="cpassword">Confirm Password : </label>
            <input type="password" name="cpassword" id="" required placeholder="Confirm your password"><br>
        </div>
        <p>Already have an account? <a href="login.html">login</a></p>
        <button type="submit">Register</button>
    </form>
</body>

</html>
