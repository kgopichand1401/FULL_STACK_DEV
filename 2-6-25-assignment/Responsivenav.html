<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #con {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 50px;
        }

        #main {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        /* exercise 7 */
        #main a {
            text-decoration: none;
            font-size: 24px;
            padding: 15px;
            transition: ease-in-out;
            transition-duration: 300ms;
        }

        #main a:hover {
            color: rgb(212, 56, 56);
            font-size: 28px;
            text-decoration: underline;
        }

        @media (max-width:768px) {
            #main {
                flex-direction: column;
                gap: 10px;
            }
        }

        @keyframes bouncetext {}
    </style>
</head>

<body>
    <div id="con">
        <div id="main">
            <a href="">Home</a>
            <a href="">About</a>
            <a href="">Services</a>
            <a href="">Contact</a>
        </div>
        <h1>WELCOME</h1>
    </div>
</body>

</html>
