<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #spin {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            border: 4px solid #e5e7eb;
            border-top: 4px solid black;
            animation: load 1s linear infinite;
        }

        #movelr {
            height: 50px;
            width: 50px;
            border: 4px solid #e5e7eb;
            background-color: black;
            margin-top: 50px;
            animation: movelr 3s linear infinite;

        }

        @keyframes load {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes movelr {
            0% {
                transform: translateX(-300px);
            }

            50% {
                transform: translateX(300px);
            }

            100% {
                transform: translateX(-300px);
            }
        }
    </style>
</head>

<body>
    <div style="display: flex;justify-content: 
        center;gap:50px;height: 50vh;flex-direction:
        column;align-items: center;">
        <div id="spin"></div>
        <div id="movelr"></div>
        <div>WELCOME</div>
    </div>
</body>

</html>
