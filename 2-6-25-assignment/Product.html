    <title>Document</title>
    <style>
        #maincon {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #con {
            display: flex;
            align-items: center;
            padding: 20px;
        }

        @media (max-width:768px) {
            #con {
                flex-direction: column;
            }
        }

        #mainc {
            display: flex;
            flex-direction: column;
            width: 300px;
            border-radius: 10px;
            height: 250px;
            border: 1px solid black;
            transition: smooth;
            box-sizing: border-box;

        }

        #img img {
            height: 100px;
            width: 100px;
        }

        #mainc h1 {
            text-align: center;
            font-size: 28px;
            font-weight: bolder;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 4px;
            background-color: black;
            color: white;
            text-align: center;
            border: none;
            font-weight: 700;
            font-size: 24px;
            cursor: pointer;
            border-radius: 6px;
            width: 200px;
            transition: ease-out 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
