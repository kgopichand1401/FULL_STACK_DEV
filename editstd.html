<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <a href="dashboard.html">Home</a>
            <a href="addstd.html">AddStudent</a>
            <a href="viewstd.html">ViewStudent</a>
            <a href="logout.html">LogOut</a>
        </nav>
    </header>
    <form action="viewstd.html">
        <h1 id="addh1">Make the changes</h1>
        <div id="con">
            <div id="main">
                <div id="details">
                    <div id="input">
                        <label for="name">Name:</label>
                        <input type="text" name="name" id="" required placeholder="Enter the name">
                    </div>
                    <div id="input">
                        <label for="rollno">Roll Number :</label>
                        <input type="text" name="rollno" id="" required placeholder="Enter RollNo">
                    </div>
                    <div id="input">
                        <label for="branch">Branch :</label>
                        <input type="text" name="branch" id="" required placeholder="Enter Branch">
                    </div>
                    <div id="input">
                        <label for="cgpa">CGPA :</label>
                        <input type="number" name="cgpa" id="" min="0" max="10" required placeholder="Enter CGPA">
                    </div>
                    <button type="submit">Save Changes</button>
                </div>
            </div>
        </div>
    </form>
</body>

</html>
